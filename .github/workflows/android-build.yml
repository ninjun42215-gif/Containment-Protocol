name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/

      - name: Configure Java, Android SDK and export signing
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends openjdk-17-jdk-headless
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          echo "Using JAVA_HOME=$JAVA_HOME"
          test -x "$JAVA_HOME/bin/java"
          test -d "$ANDROID_HOME"

          # Install the Android SDK components expected by Godot 4.3.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/cmdline-tools/bin/sdkmanager"
          test -x "$SDKMANAGER"

          # Use process substitution so the 'yes' helper's expected SIGPIPE
          # does not fail this step under Bash pipefail (Build #8 exit 141).
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses < <(yes)

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

          # Godot 4.3 reads the per-major-version EditorSettings file.
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/.ci-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "Godot Java SDK and Android SDK settings configured."
          echo "Debug signing keystore generated."
          keytool -list -keystore "$GITHUB_WORKSPACE/.ci-debug.keystore" -storepass android -alias androiddebugkey
          test -s "$GITHUB_WORKSPACE/.ci-debug.keystore"
          # Resolve the project-relative preset path to the absolute CI path.
          sed -i "s|keystore/debug=\".ci-debug.keystore\"|keystore/debug=\"$GITHUB_WORKSPACE/.ci-debug.keystore\"|" export_presets.cfg
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          grep -E '^keystore/debug(_user|_password)?=' export_presets.cfg

      - name: Validate GDScript project
        run: |
          godot --headless --path . --editor --quit

      - name: Export Debug APK
        shell: bash
        run: |
          set -euo pipefail
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          export JAVA_HOME
          export ANDROID_HOME
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0:$PATH"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$GITHUB_WORKSPACE/.ci-debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"

          echo "Godot Android export environment:"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/34.0.0/zipalign"
          test -s "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
          find "$HOME/.local/share/godot/export_templates" -maxdepth 2 -type f \\( -name 'android_debug.apk' -o -name 'android_release.apk' -o -name 'android_source.zip' \\) -print

          mkdir -v -p build/android
          godot --headless --verbose --path . --export-debug "Android" build/android/ContainmentProtocol.apk 2>&1 | tee build/android/export.log
          test -s build/android/ContainmentProtocol.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContainmentProtocol-APK
          path: build/android/ContainmentProtocol.apk
