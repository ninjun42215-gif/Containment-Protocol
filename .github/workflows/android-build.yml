name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/

      - name: Configure Java and Android export signing
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends openjdk-17-jdk-headless
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          echo "Using JAVA_HOME=$JAVA_HOME"
          test -x "$JAVA_HOME/bin/java"
          test -d "$ANDROID_HOME"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/.ci-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "Godot Java SDK and Android SDK settings configured."
          echo "Debug signing keystore generated."

      - name: Validate GDScript project
        run: |
          godot --headless --path . --editor --quit

      - name: Export Debug APK
        run: |
          mkdir -v -p build/android
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$GITHUB_WORKSPACE/.ci-debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          godot --headless --verbose --path . --export-debug "Android" build/android/ContainmentProtocol.apk
          test -s build/android/ContainmentProtocol.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContainmentProtocol-APK
          path: build/android/ContainmentProtocol.apk
