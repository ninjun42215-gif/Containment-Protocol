name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub's ubuntu-latest image already provides Java and the Android SDK.
      # Avoid setup actions that replace/reconfigure the runner's SDK installation.
      - name: Cache Godot 4.3 binary and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            Godot_v4.3-stable_linux.x86_64
            ~/.local/share/godot/export_templates/4.3.stable
          key: godot-4.3-${{ runner.os }}-android-templates-v1

      - name: Verify preinstalled Java and Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not set on this runner}"
          : "${JAVA_HOME:?JAVA_HOME is not set on this runner}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "SDKMANAGER=$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          java -version
          "$SDKMANAGER" --version

      - name: Install required Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          # Keep pipefail disabled only for license acceptance: sdkmanager can
          # close the input early, which otherwise makes yes exit with SIGPIPE.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"
          echo "Installed Android SDK packages:"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --list_installed

      - name: Download Godot 4.3 and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          GODOT_ZIP="Godot_v4.3-stable_linux.x86_64.zip"
          TEMPLATE_TPZ="Godot_v4.3-stable_export_templates.tpz"

          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/$GODOT_ZIP" \
            --output "$GODOT_ZIP"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/$TEMPLATE_TPZ" \
            --output "$TEMPLATE_TPZ"

          unzip -o "$GODOT_ZIP" -d "$GITHUB_WORKSPACE"
          chmod +x ./Godot_v4.3-stable_linux.x86_64

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          TEMPLATE_EXTRACT="$RUNNER_TEMP/godot-export-templates"
          mkdir -p "$TEMPLATE_DIR" "$TEMPLATE_EXTRACT"
          unzip -o "$TEMPLATE_TPZ" -d "$TEMPLATE_EXTRACT"
          # The .tpz archive stores templates beneath a top-level templates/ folder.
          test -d "$TEMPLATE_EXTRACT/templates"
          cp -a "$TEMPLATE_EXTRACT/templates/." "$TEMPLATE_DIR/"
          test -s "$TEMPLATE_DIR/android_source.zip"
          test -s "$TEMPLATE_DIR/android_debug.apk"

          ./Godot_v4.3-stable_linux.x86_64 --version
          echo "Godot Android templates:"
          ls -lh "$TEMPLATE_DIR"/android_*

      - name: Configure Godot Android settings and debug signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          for settings_file in \
            "$HOME/.config/godot/editor_settings-4.tres" \
            "$HOME/.config/godot/editor_settings-4.3.tres"; do
            cat > "$settings_file" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          done

          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          keytool -list -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android -alias androiddebugkey
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/34.0.0/zipalign"
          test -s "$GITHUB_WORKSPACE/debug.keystore"

      - name: Validate GDScript project
        shell: bash
        run: |
          set -euo pipefail
          VALIDATION_LOG="$RUNNER_TEMP/godot-validation.log"
          ./Godot_v4.3-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" --editor --quit 2>&1 | tee "$VALIDATION_LOG"
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" "$VALIDATION_LOG"; then
            echo "Godot reported a GDScript parse/load error."
            exit 1
          fi

      - name: Export Debug APK
        shell: bash
        run: |
          set -euo pipefail
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$GITHUB_WORKSPACE/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"

          mkdir -p build/android
          ./Godot_v4.3-stable_linux.x86_64 --headless --verbose --path "$GITHUB_WORKSPACE" \
            --export-debug "Android" build/android/ContainmentProtocol.apk \
            2>&1 | tee build/android/export.log

          test -s build/android/ContainmentProtocol.apk
          ls -lh build/android/ContainmentProtocol.apk
          tail -n 100 build/android/export.log

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContainmentProtocol-APK
          path: build/android/ContainmentProtocol.apk
          if-no-files-found: error
